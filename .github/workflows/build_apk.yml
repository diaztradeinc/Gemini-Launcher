steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Prepare Project Structure & Gradle Wrapper
    run: |
      # If the files were extracted into a nested subfolder, move them to the repo root
      if [ ! -f "build.gradle.kts" ] && [ -d "RamTRX_Cockpit_Android" ]; then
        cp -r RamTRX_Cockpit_Android/* .
      fi

      # Ensure the Gradle wrapper exists and is executable
      if [ ! -f "./gradlew" ]; then
        gradle wrapper --gradle-version 8.2.2
      fi
      chmod +x ./gradlew

  - name: Build Debug APK
    run: |
      ./gradlew assembleDebug --no-daemon --stacktrace

  - name: Locate and Collect APK
    run: |
      mkdir -p output_apks
      find . -name "*.apk" -exec cp {} output_apks/ \;
      ls -la output_apks/

  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: RamTRX_Cockpit_Debug_APK
      path: output_apks/*.apk
      retention-days: 14
